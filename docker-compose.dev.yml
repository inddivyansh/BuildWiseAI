services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL — same as production
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: buildwise_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildwise}
      POSTGRES_USER: ${POSTGRES_USER:-buildwise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildwise_user} -d ${POSTGRES_DB:-buildwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # Backend — hot-reload via volume mount
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: buildwise_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-buildwise_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-buildwise}
      STORAGE_PATH: /app/storage
      APP_ENV: development
      DEBUG: "true"
    volumes:
      # Mount source for hot-reload
      - ./backend:/app
      # Persistent storage (separate from source)
      - dev_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --reload-dir /app/engines
      --log-level debug

  # Note: Frontend runs natively with Vite dev server
  # Run: cd frontend && npm run dev
  # Vite proxies /api and /ws to http://localhost:8000

volumes:
  postgres_dev_data:
    driver: local
  dev_storage:
    driver: local
