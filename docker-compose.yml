services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL 15 with pgvector extension
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: buildwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildwise}
      POSTGRES_USER: ${POSTGRES_USER:-buildwise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only expose port in dev — remove in production
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildwise_user} -d ${POSTGRES_DB:-buildwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildwise_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host for docker network
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-buildwise_user}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-buildwise}
      STORAGE_PATH: /app/storage
      APP_ENV: production
    volumes:
      - app_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────
  # Frontend (React build served via Nginx)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_APP_NAME: ${VITE_APP_NAME:-BuildWise AI}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
    container_name: buildwise_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

# ─────────────────────────────────────────────────────────
# Persistent Volumes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local
